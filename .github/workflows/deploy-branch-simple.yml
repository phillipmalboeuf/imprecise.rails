name: Deploy Branch to AWS (Simple Docker)

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string

env:
  AWS_REGION: ca-central-1
  RUBY_VERSION: 3.4.8
  DOMAIN: impreciseanalysis.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For OIDC authentication
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "sanitized_branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"
          echo "Sanitized: $SANITIZED_BRANCH"

      - name: Get or create EC2 instance
        id: instance
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          
          # Check if instance exists
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=imprecise-$SANITIZED_BRANCH" \
                      "Name=instance-state-name,Values=running,stopped,stopping" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Creating new EC2 instance for branch: $SANITIZED_BRANCH"
            # ... (instance creation code - same as before)
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          else
            echo "Using existing instance: $INSTANCE_ID"
            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            if [ "$STATE" == "stopped" ]; then
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
              sleep 30
            fi
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          fi
          
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT

      - name: Get secrets
        id: secrets
        run: |
          RAILS_MASTER_KEY=$(aws secretsmanager get-secret-value \
            --secret-id imprecise-rails-master-key \
            --query 'SecretString' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          RDS_INFO=$(aws rds describe-db-instances \
            --db-instance-identifier postgres-standard \
            --query 'DBInstances[0].[Endpoint.Address,MasterUserSecret.SecretArn]' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          RDS_ENDPOINT=$(echo "$RDS_INFO" | awk '{print $1}')
          RDS_SECRET_ARN=$(echo "$RDS_INFO" | awk '{print $2}')
          
          if [ -n "$RDS_SECRET_ARN" ] && [ "$RDS_SECRET_ARN" != "None" ]; then
            RDS_PASSWORD=$(aws secretsmanager get-secret-value \
              --secret-id "$RDS_SECRET_ARN" \
              --query 'SecretString' \
              --output text \
              --region ${{ env.AWS_REGION }} | jq -r '.password // .')
          else
            RDS_PASSWORD=$(aws secretsmanager get-secret-value \
              --secret-id imprecise-rds-password \
              --query 'SecretString' \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          fi
          
          echo "::add-mask::$RAILS_MASTER_KEY"
          echo "::add-mask::$RDS_PASSWORD"
          echo "rails_master_key=$RAILS_MASTER_KEY" >> $GITHUB_OUTPUT
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT
          echo "rds_password=$RDS_PASSWORD" >> $GITHUB_OUTPUT

      - name: Deploy with Docker (via SSM)
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          
          # Create deployment script
          DEPLOY_SCRIPT=$(cat <<'DEPLOY_EOF'
          #!/bin/bash
          set -e
          
          BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          IMAGE_NAME="imprecise-$BRANCH"
          CONTAINER_NAME="imprecise-$BRANCH-web"
          
          echo "=== Deploying $BRANCH ==="
          
          # Ensure app directory exists
          mkdir -p /home/ubuntu/app
          cd /home/ubuntu/app
          
          # Stop existing container
          echo "Stopping existing container..."
          docker stop $CONTAINER_NAME 2>/dev/null || true
          docker rm $CONTAINER_NAME 2>/dev/null || true
          
          # Remove old image to force rebuild
          docker rmi $IMAGE_NAME 2>/dev/null || true
          
          echo "✅ Deployment complete"
          DEPLOY_EOF
          )
          
          # For now, just copy the script - we'll need to copy code and build
          # This is a simplified version - you'd need to:
          # 1. Copy code to server (via SSM or S3)
          # 2. Build Docker image
          # 3. Run container
          
          echo "Deployment script prepared (simplified version)"
