name: Deploy Branch to AWS

on:
  push:
    branches:
      - '**'  # Trigger on push to any branch
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        type: string

env:
  AWS_REGION: ca-central-1
  RUBY_VERSION: 3.4.8
  DOMAIN: impreciseanalysis.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For OIDC authentication
      actions: read  # For accessing GitHub token
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for branch detection

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            BRANCH_NAME="${{ github.event.inputs.branch }}"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          fi
          # Sanitize branch name for use in resource names (replace / with -)
          SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/\//-/g' | tr '[:upper:]' '[:lower:]')
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "sanitized_branch=$SANITIZED_BRANCH" >> $GITHUB_OUTPUT
          echo "Branch: $BRANCH_NAME"
          echo "Sanitized: $SANITIZED_BRANCH"

      - name: Get or create EC2 instance
        id: instance
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          
          # Check if instance exists
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=imprecise-$SANITIZED_BRANCH" \
                      "Name=instance-state-name,Values=running,stopped,stopping" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          if [ "$INSTANCE_ID" == "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "Creating new EC2 instance for branch: $SANITIZED_BRANCH"
            
            # Get default VPC and subnet
            VPC_ID=$(aws ec2 describe-vpcs \
              --filters "Name=isDefault,Values=true" \
              --query 'Vpcs[0].VpcId' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            # Get a public subnet (one with internet gateway route)
            SUBNET_ID=$(aws ec2 describe-subnets \
              --filters "Name=vpc-id,Values=$VPC_ID" \
              --query 'Subnets[?MapPublicIpOnLaunch==`true`] | [0].SubnetId' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            # If no public subnet found, use first subnet (might still work if IGW is configured)
            if [ "$SUBNET_ID" == "None" ] || [ -z "$SUBNET_ID" ]; then
              echo "No public subnet found, using first available subnet..."
              SUBNET_ID=$(aws ec2 describe-subnets \
                --filters "Name=vpc-id,Values=$VPC_ID" \
                --query 'Subnets[0].SubnetId' \
                --output text \
                --region ${{ env.AWS_REGION }})
            fi
            
            echo "Using subnet: $SUBNET_ID"
            
            # Create security group if it doesn't exist
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=imprecise-$SANITIZED_BRANCH-sg" \
              --query 'SecurityGroups[0].GroupId' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            if [ "$SG_ID" == "None" ] || [ -z "$SG_ID" ]; then
              SG_ID=$(aws ec2 create-security-group \
                --group-name "imprecise-$SANITIZED_BRANCH-sg" \
                --description "Security group for imprecise-$SANITIZED_BRANCH" \
                --vpc-id "$VPC_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'GroupId' \
                --output text)
              
              # Allow HTTP and HTTPS (SSH not needed, using SSM)
              aws ec2 authorize-security-group-ingress \
                --group-id "$SG_ID" \
                --protocol tcp \
                --port 80 \
                --cidr 0.0.0.0/0 \
                --region ${{ env.AWS_REGION }}
              
              aws ec2 authorize-security-group-ingress \
                --group-id "$SG_ID" \
                --protocol tcp \
                --port 443 \
                --cidr 0.0.0.0/0 \
                --region ${{ env.AWS_REGION }}
            fi
            
            # Get custom AMI or fallback to base Ubuntu AMI
            CUSTOM_AMI=$(aws ec2 describe-images \
              --owners self \
              --filters "Name=name,Values=imprecise-ubuntu-docker-kamal" \
                        "Name=state,Values=available" \
              --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            if [ -z "$CUSTOM_AMI" ] || [ "$CUSTOM_AMI" == "None" ]; then
              echo "Custom AMI not found, using base Ubuntu AMI..."
              AMI_ID=$(aws ec2 describe-images \
                --owners 099720109477 \
                --filters "Name=name,Values=ubuntu/images/hvm-ssd/ubuntu-jammy-22.04-amd64-server-*" \
                          "Name=state,Values=available" \
                --query 'Images | sort_by(@, &CreationDate) | [-1].ImageId' \
                --output text \
                --region ${{ env.AWS_REGION }})
            else
              echo "Using custom AMI: $CUSTOM_AMI"
              AMI_ID="$CUSTOM_AMI"
            fi
            
            # Prepare minimal user data script (Docker and Kamal are pre-installed in custom AMI)
            # Only need to set up directories (SSM agent is already installed in custom AMI)
            USER_DATA=$(printf '%s\n' \
              '#!/bin/bash' \
              'set -e' \
              'mkdir -p /home/ubuntu/app' \
              'chown ubuntu:ubuntu /home/ubuntu/app' \
              'echo "EC2 instance setup completed at $(date)" >> /var/log/user-data.log')
            
            # Verify subnet has internet gateway (for Docker Hub access)
            echo "Verifying subnet has internet access..."
            SUBNET_INFO=$(aws ec2 describe-subnets \
              --subnet-ids "$SUBNET_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Subnets[0].[SubnetId,MapPublicIpOnLaunch,VpcId]' \
              --output text)
            
            VPC_ID_FROM_SUBNET=$(echo "$SUBNET_INFO" | awk '{print $3}')
            IGW_CHECK=$(aws ec2 describe-internet-gateways \
              --filters "Name=attachment.vpc-id,Values=$VPC_ID_FROM_SUBNET" \
              --region ${{ env.AWS_REGION }} \
              --query 'InternetGateways[0].InternetGatewayId' \
              --output text 2>/dev/null || echo "None")
            
            if [ "$IGW_CHECK" == "None" ] || [ -z "$IGW_CHECK" ]; then
              echo "⚠️  Warning: No internet gateway found for VPC. Instance may not have internet access."
              echo "This will prevent Docker from pulling base images from Docker Hub."
            else
              echo "✅ Internet gateway found: $IGW_CHECK"
            fi
            
            # Create instance
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t3.micro \
              --subnet-id "$SUBNET_ID" \
              --security-group-ids "$SG_ID" \
              --associate-public-ip-address \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=imprecise-$SANITIZED_BRANCH},{Key=Branch,Value=${{ steps.branch.outputs.branch_name }}},{Key=Project,Value=imprecise}]" \
              --iam-instance-profile Name=imprecise-deploy-instance-profile \
              --user-data "$USER_DATA" \
              --region ${{ env.AWS_REGION }} \
              --query 'Instances[0].InstanceId' \
              --output text)
            
            echo "Waiting for instance to be running..."
            aws ec2 wait instance-running \
              --instance-ids "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }}
            
            echo "Waiting for instance to be ready..."
            sleep 30
          else
            echo "Using existing instance: $INSTANCE_ID"
            
            # Start instance if stopped
            STATE=$(aws ec2 describe-instances \
              --instance-ids "$INSTANCE_ID" \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text \
              --region ${{ env.AWS_REGION }})
            
            if [ "$STATE" == "stopped" ]; then
              aws ec2 start-instances --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
              sleep 30
            fi
          fi
          
          # Get instance IP
          INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "instance_ip=$INSTANCE_IP" >> $GITHUB_OUTPUT
          echo "Instance ID: $INSTANCE_ID"
          echo "Instance IP: $INSTANCE_IP"

      - name: Setup Route 53 DNS record
        id: setup-dns
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          INSTANCE_IP="${{ steps.instance.outputs.instance_ip }}"
          
          # Determine domain name
          if [ "${{ steps.branch.outputs.branch_name }}" == "main" ]; then
            DOMAIN_NAME="${{ env.DOMAIN }}"
          else
            DOMAIN_NAME="${SANITIZED_BRANCH}.${{ env.DOMAIN }}"
          fi
          
          echo "domain_name=$DOMAIN_NAME" >> $GITHUB_OUTPUT
          echo "Setting up DNS for: $DOMAIN_NAME -> $INSTANCE_IP"
          
          # Get hosted zone ID
          HOSTED_ZONE_ID=$(aws route53 list-hosted-zones \
            --query "HostedZones[?Name=='${{ env.DOMAIN }}.'].[Id]" \
            --output text | cut -d'/' -f3)
          
          if [ -z "$HOSTED_ZONE_ID" ] || [ "$HOSTED_ZONE_ID" == "None" ]; then
            echo "Warning: Hosted zone not found. Run scripts/setup-domain.sh first."
            exit 1
          fi
          
          # Create or update A record
          CHANGE_BATCH=$(printf '{"Changes":[{"Action":"UPSERT","ResourceRecordSet":{"Name":"%s","Type":"A","TTL":300,"ResourceRecords":[{"Value":"%s"}]}}]}' "$DOMAIN_NAME" "$INSTANCE_IP")
          
          CHANGE_ID=$(aws route53 change-resource-record-sets \
            --hosted-zone-id "$HOSTED_ZONE_ID" \
            --change-batch "$CHANGE_BATCH" \
            --query 'ChangeInfo.Id' \
            --output text)
          
          echo "DNS record created/updated: $DOMAIN_NAME -> $INSTANCE_IP"
          echo "Change ID: $CHANGE_ID"

      - name: Verify and reset SSM if needed
        run: |
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          
          # Wait for SSM agent to be ready (quick check)
          echo "Checking SSM agent status..."
          SSM_STATUS=$(aws ssm describe-instance-information \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'InstanceInformationList[0].PingStatus' \
            --output text 2>/dev/null || echo "Offline")
          
          echo "Initial SSM status: $SSM_STATUS"
          
          # If SSM is not online, reboot the instance to restart the SSM agent
          if [ "$SSM_STATUS" != "Online" ]; then
            echo "SSM agent is not online. Rebooting instance to restart SSM agent..."
            aws ec2 reboot-instances --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
            
            echo "Waiting for instance to be running again..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID" --region ${{ env.AWS_REGION }}
            sleep 30  # Give it a moment after reboot
            
            echo "Waiting for SSM agent to come online after reboot..."
            for i in {1..30}; do
              SSM_STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'InstanceInformationList[0].PingStatus' \
                --output text 2>/dev/null || echo "Offline")
              
              if [ "$SSM_STATUS" == "Online" ]; then
                echo "✅ SSM agent is now online!"
                break
              fi
              
              if [ $((i % 6)) -eq 0 ]; then
                echo "Still waiting for SSM... ($i/30 attempts)"
              fi
              
              sleep 10
            done
          else
            echo "✅ SSM agent is already online"
          fi
          
          # Verify Docker installation and internet connectivity via SSM
          if [ "$SSM_STATUS" == "Online" ]; then
            echo ""
            echo "Verifying Docker installation and internet connectivity..."
            VERIFY_CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters 'commands=["docker --version", "echo Testing internet connectivity...", "curl -I https://auth.docker.io 2>&1 | head -3 || echo Internet test failed", "echo Verification complete"]' \
              --region ${{ env.AWS_REGION }} \
              --output text --query 'Command.CommandId' 2>/dev/null || echo "")
            
            if [ -n "$VERIFY_CMD_ID" ]; then
              sleep 5
              
              # Get command output
              OUTPUT=$(aws ssm get-command-invocation \
                --command-id "$VERIFY_CMD_ID" \
                --instance-id "$INSTANCE_ID" \
                --region ${{ env.AWS_REGION }} \
                --query 'StandardOutputContent' \
                --output text 2>/dev/null || echo "")
              
              if [ -n "$OUTPUT" ] && [ "$OUTPUT" != "None" ]; then
                echo "$OUTPUT"
              fi
            fi
          else
            echo ""
            echo "⚠️  SSM agent is still not online after reboot"
            echo "Checking IAM role configuration..."
            ROLE_CHECK=$(aws iam list-attached-role-policies \
              --role-name imprecise-deploy-instance-role \
              --query 'AttachedPolicies[?PolicyArn==`arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore`]' \
              --output text 2>/dev/null || echo "")
            
            if [ -z "$ROLE_CHECK" ]; then
              echo "❌ IAM role is missing SSM policy. Run: ./scripts/fix-iam-permissions.sh"
              exit 1
            else
              echo "✅ IAM role has SSM policy attached"
              echo "SSM may need more time. Continuing with deployment..."
            fi
          fi

      - name: Get RAILS_MASTER_KEY from AWS Secrets Manager
        id: master_key
        run: |
          MASTER_KEY=$(aws secretsmanager get-secret-value \
            --secret-id imprecise-rails-master-key \
            --query 'SecretString' \
            --output text \
            --region ${{ env.AWS_REGION }})
          echo "::add-mask::$MASTER_KEY"
          echo "master_key=$MASTER_KEY" >> $GITHUB_OUTPUT

      - name: Get RDS endpoint and password
        id: rds
        run: |
          RDS_INFO=$(aws rds describe-db-instances \
            --db-instance-identifier postgres-standard \
            --query 'DBInstances[0].[Endpoint.Address,MasterUserSecret.SecretArn]' \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          RDS_ENDPOINT=$(echo "$RDS_INFO" | awk '{print $1}')
          RDS_SECRET_ARN=$(echo "$RDS_INFO" | awk '{print $2}')
          
          # Get master password from Secrets Manager
          if [ -n "$RDS_SECRET_ARN" ] && [ "$RDS_SECRET_ARN" != "None" ]; then
            RDS_PASSWORD=$(aws secretsmanager get-secret-value \
              --secret-id "$RDS_SECRET_ARN" \
              --query 'SecretString' \
              --output text \
              --region ${{ env.AWS_REGION }} | jq -r '.password // .')
          else
            # Fallback: try to get from a known secret name
            RDS_PASSWORD=$(aws secretsmanager get-secret-value \
              --secret-id imprecise-rds-password \
              --query 'SecretString' \
              --output text \
              --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          fi
          
          echo "rds_endpoint=$RDS_ENDPOINT" >> $GITHUB_OUTPUT
          if [ -n "$RDS_PASSWORD" ]; then
            echo "::add-mask::$RDS_PASSWORD"
            echo "rds_password=$RDS_PASSWORD" >> $GITHUB_OUTPUT
          else
            echo "Warning: Could not retrieve RDS password. You may need to set it manually."
            echo "rds_password=" >> $GITHUB_OUTPUT
          fi

      - name: Get ACM certificate ARN
        id: certificate
        run: |
          CERT_ARN=$(aws acm list-certificates \
            --query "CertificateSummaryList[?DomainName=='${{ env.DOMAIN }}' || DomainName=='*.${{ env.DOMAIN }}'].[CertificateArn]" \
            --output text \
            --region us-east-1 | head -n1)
          
          if [ -z "$CERT_ARN" ] || [ "$CERT_ARN" == "None" ]; then
            echo "Warning: ACM certificate not found. Run scripts/setup-domain.sh first."
            echo "cert_arn=" >> $GITHUB_OUTPUT
          else
            echo "cert_arn=$CERT_ARN" >> $GITHUB_OUTPUT
            echo "Using certificate: $CERT_ARN"
          fi

      - name: Configure Kamal for branch
        id: kamal-config
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          INSTANCE_IP="${{ steps.instance.outputs.instance_ip }}"
          
          # Determine domain name (use from DNS step if available, otherwise calculate)
          if [ -n "${{ steps.setup-dns.outputs.domain_name }}" ]; then
            DOMAIN_NAME="${{ steps.setup-dns.outputs.domain_name }}"
          else
            if [ "${{ steps.branch.outputs.branch_name }}" == "main" ]; then
              DOMAIN_NAME="${{ env.DOMAIN }}"
            else
              DOMAIN_NAME="${SANITIZED_BRANCH}.${{ env.DOMAIN }}"
            fi
          fi
          
          echo "domain_name=$DOMAIN_NAME" >> $GITHUB_OUTPUT
          
          # Create branch-specific deploy config
          # Use a hostname alias that matches the config file pattern (avoids Kamal filename issues)
          # SSH will route through SSM via SSH config
          HOSTNAME_ALIAS="$SANITIZED_BRANCH"
          CONFIG_FILE="config/deploy.$SANITIZED_BRANCH.yml"
          RDS_ENDPOINT="${{ steps.rds.outputs.rds_endpoint }}"
          
          echo "Creating deploy config file: $CONFIG_FILE"
          echo "Hostname alias: $HOSTNAME_ALIAS"
          echo "Domain: $DOMAIN_NAME"
          echo "RDS endpoint: $RDS_ENDPOINT"
          
          # Create config file using printf to avoid heredoc indentation issues
          printf '%s\n' \
            "service: imprecise-$SANITIZED_BRANCH" \
            "image: imprecise-$SANITIZED_BRANCH" \
            "" \
            "servers:" \
            "  web:" \
            "    - $HOSTNAME_ALIAS" \
            "" \
            "ssh:" \
            "  user: ubuntu" \
            "" \
            "proxy:" \
            "  ssl: true" \
            "  host: $DOMAIN_NAME" \
            "" \
            "env:" \
            "  secret:" \
            "    - RAILS_MASTER_KEY" \
            "    - DB_PASSWORD" \
            "  clear:" \
            "    RAILS_ENV: production" \
            "    DB_HOST: $RDS_ENDPOINT" \
            "    DB_USERNAME: postgres" \
            "    DB_DATABASE: imprecise_${SANITIZED_BRANCH}_production" \
            "    DB_PORT: \"5432\"" \
            "" \
            "volumes:" \
            "  - \"imprecise_${SANITIZED_BRANCH}_storage:/rails/storage\"" \
            "" \
            "asset_path: /rails/public/assets" \
            "" \
            "builder:" \
            "  arch: amd64" \
            > "$CONFIG_FILE"
          
          echo "Deploy config file created: $CONFIG_FILE"
          echo "File contents:"
          cat "$CONFIG_FILE"
          echo ""
          
          # Verify file exists and is not empty
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "ERROR: Config file was not created!"
            exit 1
          fi
          
          if [ ! -s "$CONFIG_FILE" ]; then
            echo "ERROR: Config file is empty!"
            exit 1
          fi
          
          echo "✅ Created deploy config for $DOMAIN_NAME"

      - name: Package code for deployment
        id: package
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          S3_BUCKET="imprecise-deployments"
          S3_KEY="deployments/${SANITIZED_BRANCH}-$(date +%s).tar.gz"
          
          # Create tarball (exclude git and other unnecessary files)
          echo "Creating deployment package..."
          tar --exclude='.git' \
              --exclude='node_modules' \
              --exclude='tmp' \
              --exclude='log' \
              --exclude='.kamal' \
              -czf /tmp/deployment.tar.gz .
          
          # Create S3 bucket if it doesn't exist
          aws s3 mb s3://$S3_BUCKET --region ${{ env.AWS_REGION }} 2>/dev/null || true
          
          # Upload to S3
          echo "Uploading to S3..."
          aws s3 cp /tmp/deployment.tar.gz s3://$S3_BUCKET/$S3_KEY --region ${{ env.AWS_REGION }}
          
          # Get pre-signed URL (valid for 1 hour)
          S3_URL=$(aws s3 presign s3://$S3_BUCKET/$S3_KEY --expires-in 3600 --region ${{ env.AWS_REGION }})
          
          echo "s3_url=$S3_URL" >> $GITHUB_OUTPUT
          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "Package uploaded: $S3_KEY"

      - name: Deploy with Docker (Simple - No Kamal)
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          INSTANCE_ID="${{ steps.instance.outputs.instance_id }}"
          BRANCH_NAME="${{ steps.branch.outputs.branch_name }}"
          RAILS_MASTER_KEY="${{ steps.master_key.outputs.master_key }}"
          RDS_ENDPOINT="${{ steps.rds.outputs.rds_endpoint }}"
          RDS_PASSWORD="${{ steps.rds.outputs.rds_password }}"
          S3_URL="${{ steps.package.outputs.s3_url }}"
          
          echo "Deploying branch '$BRANCH_NAME' to instance $INSTANCE_ID"
          echo "Sanitized branch: $SANITIZED_BRANCH"
          
          # Create deployment commands as an array (SSM handles arrays better than multi-line strings)
          echo "Deploying via SSM..."
          
          # Split into separate commands for better visibility and error handling
          # Step 1: Download and extract
          echo "Step 1: Downloading and extracting code..."
          # Properly escape the S3 URL for SSM (use single quotes to prevent shell interpretation)
          DOWNLOAD_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\", \"mkdir -p /home/ubuntu/app\", \"cd /home/ubuntu/app\", \"echo Downloading from S3...\", \"curl -L '$S3_URL' -o /tmp/deployment.tar.gz\", \"if [ \\\$? -ne 0 ]; then echo 'Download failed!'; exit 1; fi\", \"echo Extracting...\", \"tar -xzf /tmp/deployment.tar.gz\", \"if [ \\\$? -ne 0 ]; then echo 'Extraction failed!'; exit 1; fi\", \"rm /tmp/deployment.tar.gz\", \"echo ✅ Code extracted\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          # Wait for download to complete
          echo "Waiting for download/extract to complete..."
          DOWNLOAD_STATUS="InProgress"
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$DOWNLOAD_CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")
            
            DOWNLOAD_STATUS="$STATUS"
            
            if [ $((i % 6)) -eq 0 ]; then
              ELAPSED=$((i * 5 / 60))
              echo "[$ELAPSED min] Download status: $STATUS"
            fi
            
            if [ "$STATUS" == "Success" ] || [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ]; then
              break
            fi
            sleep 5
          done
          
          # Check download result
          DOWNLOAD_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$DOWNLOAD_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          
          DOWNLOAD_ERROR=$(aws ssm get-command-invocation \
            --command-id "$DOWNLOAD_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardErrorContent' \
            --output text 2>/dev/null || echo "")
          
          echo ""
          echo "=== Download/Extract Output ==="
          echo "$DOWNLOAD_OUTPUT"
          
          if [ -n "$DOWNLOAD_ERROR" ] && [ "$DOWNLOAD_ERROR" != "None" ]; then
            echo ""
            echo "=== Download Errors ==="
            echo "$DOWNLOAD_ERROR"
          fi
          
          if [ "$DOWNLOAD_STATUS" != "Success" ]; then
            echo ""
            echo "❌ Download/extract failed with status: $DOWNLOAD_STATUS"
            exit 1
          fi
          
          echo ""
          echo "✅ Download/extract completed successfully"
          
          # Verify files were extracted
          echo "Verifying files were extracted..."
          VERIFY_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cd /home/ubuntu/app\", \"if [ -f Dockerfile ]; then echo '✅ Dockerfile found'; else echo '❌ Dockerfile not found'; exit 1; fi\", \"if [ -f Gemfile ]; then echo '✅ Gemfile found'; else echo '❌ Gemfile not found'; exit 1; fi\", \"ls -la | head -10\", \"echo 'Files verified'\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          sleep 3
          VERIFY_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$VERIFY_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          
          echo "$VERIFY_OUTPUT"
          
          if echo "$VERIFY_OUTPUT" | grep -q "not found"; then
            echo "❌ Required files not found after extraction!"
            exit 1
          fi
          
          echo "✅ Files verified"
          
          # Step 2: Stop old container
          echo "Step 2: Stopping old container..."
          STOP_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"CONTAINER_NAME=imprecise-${SANITIZED_BRANCH}-web\", \"docker stop \\\$CONTAINER_NAME 2>/dev/null || true\", \"docker rm \\\$CONTAINER_NAME 2>/dev/null || true\", \"echo ✅ Old container stopped\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          sleep 5
          
          # Step 3: Build Docker image and wait for it to finish
          echo "Step 3: Building Docker image..."
          BUILD_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\", \"cd /home/ubuntu/app\", \"echo Building Docker image...\", \"docker build -t imprecise-${SANITIZED_BRANCH}:latest . 2>&1\", \"BUILD_EXIT=\\\$?\", \"echo 'Build exit code: '\$BUILD_EXIT\", \"if [ \\\$BUILD_EXIT -ne 0 ]; then echo 'Build failed!'; exit 1; fi\", \"echo 'Verifying image was built...'\", \"docker images | grep imprecise-${SANITIZED_BRANCH} || echo 'No imprecise images'\", \"echo ✅ Build complete\"]" \
            --timeout-seconds 2400 \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          echo "Build command ID: $BUILD_CMD_ID"
          echo "Waiting for build to complete..."
          
          # Wait for build to finish (check every 30 seconds, max 20 minutes)
          for i in {1..40}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$BUILD_CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")
            
            if [ $((i % 4)) -eq 0 ]; then
              ELAPSED=$((i * 30 / 60))
              echo "[$ELAPSED min] Build status: $STATUS"
            fi
            
            if [ "$STATUS" == "Success" ] || [ "$STATUS" == "Failed" ] || [ "$STATUS" == "TimedOut" ]; then
              break
            fi
            
            sleep 30
          done
          
          # Check build result
          BUILD_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$BUILD_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          
          BUILD_ERROR=$(aws ssm get-command-invocation \
            --command-id "$BUILD_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardErrorContent' \
            --output text 2>/dev/null || echo "")
          
          if [ "$STATUS" != "Success" ]; then
            echo "❌ Docker build failed with status: $STATUS"
            echo "Build output:"
            echo "$BUILD_OUTPUT" | tail -50
            if [ -n "$BUILD_ERROR" ] && [ "$BUILD_ERROR" != "None" ]; then
              echo "Build errors:"
              echo "$BUILD_ERROR" | tail -50
            fi
            exit 1
          fi
          
          echo "✅ Docker build completed successfully"
          
          # Now find the first available image
          echo "Finding first available image..."
          
          # Find the first available image (should be the one we just built, or use existing one)
          echo "Finding first available image..."
          FIND_IMAGE_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"IMAGE_NAME=\\\$(docker images --format '{{.Repository}}:{{.Tag}}' | grep 'imprecise-${SANITIZED_BRANCH}' | head -1)\", \"if [ -n \\\"\\\$IMAGE_NAME\\\" ]; then echo \\\"Found image: \\\$IMAGE_NAME\\\"; echo \\\$IMAGE_NAME > /tmp/image_name.txt; else echo 'No image found!'; exit 1; fi\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          sleep 3
          FIND_IMAGE_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$FIND_IMAGE_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          
          echo "$FIND_IMAGE_OUTPUT"
          
          # Get the image name
          GET_IMAGE_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"cat /tmp/image_name.txt 2>/dev/null || echo ''\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          sleep 2
          IMAGE_NAME=$(aws ssm get-command-invocation \
            --command-id "$GET_IMAGE_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null | tr -d '\n' || echo "")
          
          if [ -z "$IMAGE_NAME" ] || [ "$IMAGE_NAME" == "None" ]; then
            echo "❌ Could not find any imprecise-${SANITIZED_BRANCH} image!"
            exit 1
          fi
          
          echo "✅ Using image: $IMAGE_NAME"
          
          # Step 4: Start container with the image we found/built
          echo "Step 4: Starting container with image: $IMAGE_NAME"
          
          START_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\", \"cd /home/ubuntu/app\", \"CONTAINER_NAME=imprecise-${SANITIZED_BRANCH}-web\", \"echo Starting container with image: ${IMAGE_NAME}\", \"echo Verifying image exists...\", \"docker images --format '{{.Repository}}:{{.Tag}}' | grep -F '${IMAGE_NAME}' || (echo 'Image ${IMAGE_NAME} not found!'; docker images | grep imprecise-${SANITIZED_BRANCH}; exit 1)\", \"echo Stopping any existing container...\", \"docker stop \$CONTAINER_NAME 2>/dev/null || true\", \"docker rm \$CONTAINER_NAME 2>/dev/null || true\", \"echo Running container...\", \"docker run -d --name \$CONTAINER_NAME --restart unless-stopped -p 3000:80 -e RAILS_ENV=production -e RAILS_MASTER_KEY='$RAILS_MASTER_KEY' -e DB_HOST='$RDS_ENDPOINT' -e DB_USERNAME=postgres -e DB_PASSWORD='$RDS_PASSWORD' -e DB_DATABASE=imprecise_${SANITIZED_BRANCH}_production -e DB_PORT=5432 -v imprecise_${SANITIZED_BRANCH}_storage:/rails/storage ${IMAGE_NAME}\", \"if [ \$? -ne 0 ]; then echo Docker run failed; echo 'Available images:'; docker images | grep imprecise-${SANITIZED_BRANCH} || echo 'No imprecise images found'; docker ps -a; exit 1; fi\", \"sleep 3\", \"docker ps | grep \$CONTAINER_NAME || echo Container not in running list\", \"echo Container start completed\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId')
          
          echo "Container start command ID: $START_CMD_ID"
          echo "Waiting for container to start..."
          
          # Wait for start command to complete
          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$START_CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'Status' \
              --output text 2>/dev/null || echo "InProgress")
            
            if [ "$STATUS" == "Success" ] || [ "$STATUS" == "Failed" ]; then
              break
            fi
            sleep 2
          done
          
          # Get start command output
          START_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$START_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          
          START_ERROR=$(aws ssm get-command-invocation \
            --command-id "$START_CMD_ID" \
            --instance-id "$INSTANCE_ID" \
            --region ${{ env.AWS_REGION }} \
            --query 'StandardErrorContent' \
            --output text 2>/dev/null || echo "")
          
          echo ""
          echo "=== Container Start Output ==="
          echo "$START_OUTPUT"
          
          if [ -n "$START_ERROR" ] && [ "$START_ERROR" != "None" ]; then
            echo ""
            echo "=== Container Start Errors ==="
            echo "$START_ERROR"
          fi
          
          if [ "$STATUS" == "Failed" ]; then
            echo ""
            echo "❌ Container start failed! Check errors above."
            exit 1
          fi
          
          sleep 3
          
          # Verify container is running
          echo "Verifying container is running..."
          CONTAINER_CHECK_CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"docker ps -a | grep imprecise-${SANITIZED_BRANCH} || echo 'No container found'\"]" \
            --region ${{ env.AWS_REGION }} \
            --output text --query 'Command.CommandId' 2>/dev/null || echo "")
          
          if [ -n "$CONTAINER_CHECK_CMD_ID" ]; then
            sleep 3
            CONTAINER_STATUS=$(aws ssm get-command-invocation \
              --command-id "$CONTAINER_CHECK_CMD_ID" \
              --instance-id "$INSTANCE_ID" \
              --region ${{ env.AWS_REGION }} \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || echo "")
            
            if [ -n "$CONTAINER_STATUS" ] && [ "$CONTAINER_STATUS" != "None" ]; then
              echo "Container status:"
              echo "$CONTAINER_STATUS"
              
              # Get container logs
              LOGS_CMD_ID=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters "commands=[\"docker logs --tail 30 imprecise-${SANITIZED_BRANCH}-web 2>&1 || echo 'No logs available'\"]" \
                --region ${{ env.AWS_REGION }} \
                --output text --query 'Command.CommandId' 2>/dev/null || echo "")
              
              if [ -n "$LOGS_CMD_ID" ]; then
                sleep 3
                CONTAINER_LOGS=$(aws ssm get-command-invocation \
                  --command-id "$LOGS_CMD_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --region ${{ env.AWS_REGION }} \
                  --query 'StandardOutputContent' \
                  --output text 2>/dev/null || echo "")
                
                if [ -n "$CONTAINER_LOGS" ] && [ "$CONTAINER_LOGS" != "None" ]; then
                  echo ""
                  echo "Container logs:"
                  echo "$CONTAINER_LOGS"
                fi
              fi
              
              # Check if container is running
              if echo "$CONTAINER_STATUS" | grep -q "Up\|running"; then
                echo ""
                echo "✅ Container is running! Deployment successful!"
                exit 0
              elif echo "$CONTAINER_STATUS" | grep -q "Exited\|Stopped"; then
                echo ""
                echo "❌ Container exited. Check logs above for errors."
                exit 1
              else
                echo ""
                echo "⚠️  Container status unclear. Check manually:"
                echo "  aws ssm send-command --instance-ids $INSTANCE_ID --document-name AWS-RunShellScript --parameters 'commands=[\"docker ps -a\"]' --region ${{ env.AWS_REGION }}"
              fi
            fi
          fi
          
          echo ""
          echo "✅ Deployment steps completed. Check container status above."

      - name: Deployment summary
        run: |
          SANITIZED_BRANCH="${{ steps.branch.outputs.sanitized_branch }}"
          
          # Determine domain name
          if [ "${{ steps.branch.outputs.branch_name }}" == "main" ]; then
            DOMAIN_NAME="${{ env.DOMAIN }}"
          else
            DOMAIN_NAME="${SANITIZED_BRANCH}.${{ env.DOMAIN }}"
          fi
          
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ steps.branch.outputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance ID**: ${{ steps.instance.outputs.instance_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Instance IP**: ${{ steps.instance.outputs.instance_ip }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: $DOMAIN_NAME" >> $GITHUB_STEP_SUMMARY
          echo "- **Container**: imprecise-${SANITIZED_BRANCH}-web" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Access your application at:" >> $GITHUB_STEP_SUMMARY
          echo "- **HTTP**: http://${{ steps.instance.outputs.instance_ip }}:3000" >> $GITHUB_STEP_SUMMARY
          echo "- **Domain**: http://$DOMAIN_NAME (if DNS configured)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Note: SSL/HTTPS setup requires additional nginx configuration (not included in this simple deployment)"
